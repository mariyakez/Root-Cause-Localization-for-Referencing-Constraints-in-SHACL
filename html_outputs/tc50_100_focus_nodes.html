<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap');

:root {
  --bg:          #0f1117;
  --surface:     #171b26;
  --surface2:    #1e2333;
  --surface3:    #252b3d;
  --border:      #2a3149;
  --border2:     #363f5c;
  --text:        #e2e8f5;
  --text-muted:  #6b7a9e;
  --text-dim:    #4a5578;
  --red:         #ff4f6d;
  --red-bg:      #1f0d12;
  --red-border:  #4a1523;
  --orange:      #f97316;
  --orange-bg:   #1a1008;
  --yellow:      #fbbf24;
  --green:       #34d399;
  --green-bg:    #091a14;
  --blue:        #60a5fa;
  --blue-bg:     #0d1829;
  --purple:      #a78bfa;
  --purple-bg:   #130e24;
  --cyan:        #22d3ee;
  --chain-line:  #2a3149;
  --mono: 'IBM Plex Mono', monospace;
  --sans: 'IBM Plex Sans', sans-serif;
  --sidebar-width: 220px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--sans);
  font-size: 14px;
  line-height: 1.6;
  min-height: 100vh;
}

/* ── top bar ── */
.topbar {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 14px 32px;
  display: flex;
  align-items: center;
  gap: 16px;
  position: sticky;
  top: 0;
  z-index: 100;
}
.topbar-logo {
  font-family: var(--mono);
  font-size: 13px;
  font-weight: 600;
  color: var(--cyan);
  letter-spacing: .06em;
}
.topbar-sep { color: var(--border2); }
.topbar-title {
  font-family: var(--sans);
  font-size: 13px;
  color: var(--text-muted);
}
.topbar-stats {
  margin-left: auto;
  display: flex;
  gap: 20px;
  font-family: var(--mono);
  font-size: 11px;
}
.stat { display: flex; flex-direction: column; align-items: flex-end; gap: 1px; }
.stat-val { color: var(--text); font-weight: 600; font-size: 13px; }
.stat-lbl { color: var(--text-dim); font-size: 10px; letter-spacing: .05em; text-transform: uppercase; }

/* ── layout ── */
.layout { display: flex; min-height: calc(100vh - 49px); }

/* ── sidebar ── */
.sidebar {
  width: var(--sidebar-width);
  min-width: 180px;
  max-width: 520px;
  background: var(--surface);
  border-right: 1px solid var(--border);
  padding: 20px 0;
  position: sticky;
  top: 49px;
  height: calc(100vh - 49px);
  overflow-y: auto;
  flex-shrink: 0;
}
.sidebar-resizer {
  position: absolute;
  top: 0;
  right: -4px;
  width: 8px;
  height: 100%;
  cursor: col-resize;
  z-index: 20;
}
.sidebar-resizer::after {
  content: "";
  position: absolute;
  top: 0;
  right: 3px;
  width: 1px;
  height: 100%;
  background: transparent;
  transition: background .12s;
}
.sidebar-resizer:hover::after,
.sidebar.resizing .sidebar-resizer::after {
  background: var(--cyan);
}
body.resizing-sidebar {
  cursor: col-resize;
  user-select: none;
}
.sidebar-label {
  font-family: var(--mono);
  font-size: 10px;
  font-weight: 600;
  color: var(--text-dim);
  letter-spacing: .1em;
  text-transform: uppercase;
  padding: 0 16px 8px;
}
.focus-search-wrap {
  padding: 0 12px 12px;
}
.focus-search {
  width: 100%;
  box-sizing: border-box;
  border: 1px solid var(--border2);
  border-radius: 6px;
  background: var(--bg);
  color: var(--text);
  font-family: var(--mono);
  font-size: 12px;
  padding: 8px 10px;
  outline: none;
}
.focus-search::placeholder { color: var(--text-dim); }
.focus-search:focus {
  border-color: var(--cyan);
  box-shadow: 0 0 0 2px rgba(34,211,238,.12);
}
.focus-empty {
  display: none;
  padding: 8px 16px;
  color: var(--text-dim);
  font-family: var(--mono);
  font-size: 11px;
}
.focus-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 7px 16px;
  cursor: pointer;
  border-left: 2px solid transparent;
  transition: all .12s;
  font-family: var(--mono);
  font-size: 12px;
  color: var(--text-muted);
}
.focus-name {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.focus-item:hover { background: var(--surface2); color: var(--text); }
.focus-item.active {
  background: var(--surface2);
  border-left-color: var(--cyan);
  color: var(--cyan);
}
.focus-dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--red);
  flex-shrink: 0;
}
.focus-count {
  margin-left: auto;
  background: var(--red-bg);
  color: var(--red);
  border: 1px solid var(--red-border);
  border-radius: 3px;
  padding: 0 5px;
  font-size: 10px;
  font-weight: 600;
}

/* ── main ── */
.main { flex: 1; padding: 32px; overflow-x: auto; }

/* ── focus block ── */
.focus-block {
  margin-bottom: 40px;
  animation: fadeUp .3s ease both;
}
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(6px); }
  to   { opacity: 1; transform: translateY(0); }
}
.focus-header {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 16px;
}
.focus-node-label {
  font-family: var(--mono);
  font-size: 18px;
  font-weight: 600;
  color: var(--text);
}
.focus-badge {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--text-muted);
  background: var(--surface2);
  border: 1px solid var(--border2);
  border-radius: 4px;
  padding: 2px 8px;
}
.failure-count {
  margin-left: auto;
  font-family: var(--mono);
  font-size: 12px;
  color: var(--red);
  background: var(--red-bg);
  border: 1px solid var(--red-border);
  border-radius: 4px;
  padding: 3px 10px;
}

/* ── tree container ── */
.tree { display: flex; flex-direction: column; gap: 6px; }

/* ── reference node ── */
.ref-node { position: relative; }
.ref-header {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 14px;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 8px;
  cursor: pointer;
  transition: border-color .12s, background .12s;
  user-select: none;
}
.ref-header:hover { border-color: var(--border2); background: var(--surface3); }
.ref-arrow {
  font-size: 11px;
  color: var(--text-dim);
  transition: transform .2s;
  flex-shrink: 0;
}
.ref-arrow.open { transform: rotate(90deg); }
.ref-icon {
  font-size: 13px;
  color: var(--cyan);
  flex-shrink: 0;
}
.ref-path {
  font-family: var(--mono);
  font-size: 13px;
  font-weight: 600;
  color: var(--cyan);
}
.ref-arrow-label {
  font-size: 11px;
  color: var(--text-dim);
  font-family: var(--mono);
}
.ref-target {
  font-family: var(--mono);
  font-size: 13px;
  color: var(--blue);
}
.ref-source {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--text-muted);
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.ref-leaf-pill {
  font-family: var(--mono);
  font-size: 10px;
  color: var(--red);
  background: var(--red-bg);
  border: 1px solid var(--red-border);
  border-radius: 3px;
  padding: 1px 7px;
  flex-shrink: 0;
}
.ref-chain-pill {
  font-family: var(--mono);
  font-size: 10px;
  color: var(--text-dim);
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 3px;
  padding: 1px 7px;
}
.ref-children {
  margin-left: 24px;
  margin-top: 6px;
  padding-left: 16px;
  border-left: 1px solid var(--chain-line);
  display: flex;
  flex-direction: column;
  gap: 6px;
  overflow: hidden;
  transition: max-height .25s ease, opacity .2s ease;
}
.ref-children.collapsed { max-height: 0 !important; opacity: 0; }

/* ── leaf node ── */
.leaf-node {
  border: 1px solid var(--border);
  border-radius: 8px;
  overflow: hidden;
  transition: border-color .12s;
}
.leaf-node:hover { border-color: var(--border2); }

.leaf-header {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 14px;
  cursor: pointer;
}
.leaf-icon { font-size: 14px; flex-shrink: 0; }
.leaf-comp {
  font-family: var(--mono);
  font-size: 11px;
  font-weight: 600;
  border-radius: 3px;
  padding: 2px 7px;
  flex-shrink: 0;
}
.comp-mincount  { background: #1a1029; color: #c084fc; border: 1px solid #3b1d6e; }
.comp-datatype  { background: #1a0e08; color: #fb923c; border: 1px solid #6b2d0d; }
.comp-pattern   { background: #0d1a18; color: #34d399; border: 1px solid #0e4a37; }
.comp-in        { background: #0d1629; color: #60a5fa; border: 1px solid #1a3a6e; }
.comp-maxcount  { background: #1a1a08; color: #facc15; border: 1px solid #6b5a0d; }
.comp-default   { background: var(--surface2); color: var(--text-muted); border: 1px solid var(--border); }

.leaf-path {
  font-family: var(--mono);
  font-size: 13px;
  color: var(--text);
  font-weight: 500;
}
.leaf-eq { color: var(--text-dim); font-family: var(--mono); }
.leaf-value {
  font-family: var(--mono);
  font-size: 12px;
  color: var(--yellow);
  background: rgba(251,191,36,.08);
  border-radius: 3px;
  padding: 1px 6px;
}
.leaf-missing {
  font-family: var(--mono);
  font-size: 12px;
  color: var(--text-dim);
  font-style: italic;
}
.leaf-focus {
  font-family: var(--mono);
  font-size: 13px;
  color: var(--text);
  font-weight: 600;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.leaf-desc {
  font-family: var(--mono);
  font-size: 13px;
  color: var(--text-muted);
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.leaf-dot {
  color: var(--text-dim);
  font-family: var(--mono);
  flex-shrink: 0;
}
.leaf-toggle {
  margin-left: auto;
  font-size: 11px;
  color: var(--text-dim);
  transition: transform .2s;
  flex-shrink: 0;
}
.leaf-toggle.open { transform: rotate(180deg); }

/* leaf body */
.leaf-body {
  background: var(--surface);
  border-top: 1px solid var(--border);
  padding: 12px 14px;
  display: grid;
  grid-template-columns: 90px 1fr;
  gap: 8px 12px;
  font-size: 12px;
  overflow: hidden;
  transition: max-height .22s ease, opacity .18s ease;
}
.leaf-body.collapsed { max-height: 0 !important; opacity: 0; border-top: none; padding: 0 14px; }
.leaf-row-label {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--text-dim);
  text-transform: uppercase;
  letter-spacing: .06em;
  padding-top: 1px;
}
.leaf-row-val { font-family: var(--mono); font-size: 12px; color: var(--text); }
.leaf-message { color: var(--text-muted); font-family: var(--sans); font-size: 12px; }
.leaf-hint { color: var(--green); font-family: var(--sans); font-size: 12px; }
.leaf-chain { color: var(--blue); }
.leaf-altchain {
  color: var(--text-dim);
  font-size: 11px;
  font-family: var(--mono);
  margin-top: 2px;
}
.alt-label {
  color: var(--purple);
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: .06em;
  font-weight: 600;
}

/* leaf node coloring by component */
.leaf-node.lf-mincount  { border-left: 3px solid #c084fc; }
.leaf-node.lf-datatype  { border-left: 3px solid #fb923c; }
.leaf-node.lf-pattern   { border-left: 3px solid #34d399; }
.leaf-node.lf-in        { border-left: 3px solid #60a5fa; }
.leaf-node.lf-maxcount  { border-left: 3px solid #facc15; }

/* ── filter bar ── */
.filter-bar {
  display: flex;
  gap: 8px;
  margin-bottom: 24px;
  flex-wrap: wrap;
  align-items: center;
}
.filter-group {
  display: contents;
}
.filter-btn {
  font-family: var(--mono);
  font-size: 11px;
  padding: 4px 12px;
  border-radius: 4px;
  border: 1px solid var(--border2);
  background: var(--surface2);
  color: var(--text-muted);
  cursor: pointer;
  transition: all .12s;
}
.filter-btn:hover { border-color: var(--cyan); color: var(--cyan); }
.filter-btn.active { border-color: var(--cyan); color: var(--cyan); background: rgba(34,211,238,.08); }
.filter-sep { color: var(--border2); font-size: 12px; }
.filter-label {
  font-size: 11px;
  color: var(--text-dim);
  font-family: var(--mono);
  text-transform: uppercase;
  letter-spacing: .05em;
}
.filter-count {
  color: var(--text-dim);
  margin-left: 4px;
}
.showing-count {
  font-family: var(--mono);
  font-size: 10px;
  color: var(--text-dim);
  background: transparent;
  border: none;
  padding: 2px 4px;
  white-space: nowrap;
}

/* ── view controls ── */
.expand-all-btn {
  font-family: var(--mono);
  font-size: 10px;
  padding: 2px 7px;
  border-radius: 3px;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--text-dim);
  cursor: pointer;
  transition: all .12s;
}
.expand-all-btn:hover {
  border-color: var(--border2);
  color: var(--text-muted);
  background: rgba(255,255,255,.02);
}
.filter-actions {
  margin-left: auto;
  display: flex;
  gap: 5px;
  flex-wrap: wrap;
  align-items: center;
}

/* ── generated line ── */
.generated {
  text-align: center;
  font-family: var(--mono);
  font-size: 11px;
  color: var(--text-dim);
  padding: 32px 0 16px;
  border-top: 1px solid var(--border);
  margin-top: 40px;
}
</style>
</head>

const COMP_MAP = {
  "sh:MinCountConstraintComponent":  { short: "minCount",  cls: "mincount"  },
  "sh:MaxCountConstraintComponent":  { short: "maxCount",  cls: "maxcount"  },
  "sh:DatatypeConstraintComponent":  { short: "datatype",  cls: "datatype"  },
  "sh:PatternConstraintComponent":   { short: "pattern",   cls: "pattern"   },
  "sh:InConstraintComponent":        { short: "in",        cls: "in"        },
  "sh:ClassConstraintComponent":     { short: "class",     cls: "default"   },
};

function compInfo(uri) {
  return COMP_MAP[uri] || { short: uri.split(":").pop().replace("ConstraintComponent",""), cls: "default" };
}

function countLeaves(nodes) {
  let n = 0;
  for (const node of nodes) {
    if (node.type === "leaf") n++;
    else if (node.children) n += countLeaves(node.children);
  }
  return n;
}

function maxDepth(nodes, d=0) {
  let m = d;
  for (const node of nodes) {
    if (node.type === "reference" && node.children)
      m = Math.max(m, maxDepth(node.children, d+1));
  }
  return m;
}

function allLeaves(nodes) {
  const out = [];
  function walk(ns) {
    for (const n of ns) {
      if (n.type === "leaf") out.push(n);
      else if (n.children) walk(n.children);
    }
  }
  walk(nodes);
  return out;
}

function countMapEntries(map) {
  return Array.from(map.entries()).sort((a, b) => {
    if (b[1] !== a[1]) return b[1] - a[1];
    return a[0].localeCompare(b[0]);
  });
}

function addCount(map, key) {
  if (!key) return;
  map.set(key, (map.get(key) || 0) + 1);
}

function collectFilterStats(nodes) {
  const stats = {
    component: new Map(),
    path: new Map(),
    referencePath: new Map(),
    shape: new Map(),
    kind: new Map(),
  };

  function walk(ns, ctx={ referencePaths: [], shapes: [] }) {
    for (const n of ns) {
      if (n.type === "leaf") {
        const info = compInfo(n.component);
        const kind = (n.refChain || []).length === 0 ? "direct" : "nested";
        addCount(stats.component, info.short);
        addCount(stats.path, n.path || "(no path)");
        addCount(stats.kind, kind);
        ctx.referencePaths.forEach(p => addCount(stats.referencePath, p));
        ctx.shapes.forEach(s => addCount(stats.shape, s));
      } else if (n.children) {
        const next = {
          referencePaths: n.path
            ? [...ctx.referencePaths, n.path]
            : [...ctx.referencePaths],
          shapes: (n.referencedShape || n.shape)
            ? [...ctx.shapes, n.referencedShape || n.shape]
            : [...ctx.shapes],
        };
        walk(n.children, next);
      }
    }
  }

  walk(nodes);
  return stats;
}

// ── leaf DOM ─────────────────────────────────────────────────────────────
let leafId = 0;
function leafHeaderText(node, info) {
  const path = node.path || "path";
  if (info.cls === "mincount") return `missing ${path}`;
  if (info.cls === "maxcount") return `too many ${path}`;
  if (info.cls === "datatype") return `invalid datatype on ${path}`;
  if (info.cls === "pattern") return `pattern mismatch on ${path}`;
  if (info.cls === "in") return `invalid choice on ${path}`;
  if (node.value) return `${info.short} failed on ${path}`;
  return `${info.short} ${path}`;
}

function mkLeaf(node, ctx={ referencePaths: [], shapes: [] }) {
  const info  = compInfo(node.component);
  const id    = `leaf-${leafId++}`;
  const chain = node.refChain || [];
  const depth = chain.length;
  const kind  = depth === 0 ? "direct" : "nested";
  const headerText = leafHeaderText(node, info);

  const el = document.createElement("div");
  el.className = `leaf-node lf-${info.cls}`;
  el.dataset.component = info.short;
  el.dataset.path = node.path || "(no path)";
  el.dataset.kind = kind;
  el.dataset.referencePaths = JSON.stringify(ctx.referencePaths || []);
  el.dataset.shapes = JSON.stringify(ctx.shapes || []);

  el.innerHTML = `
    <div class="leaf-header" onclick="toggleLeaf('${id}')">
      <span class="leaf-icon">❌</span>
      <span class="leaf-comp comp-${info.cls}">${info.short}</span>
      <span class="leaf-focus">${esc(node.focusNode || "")}</span>
      <span class="leaf-dot">·</span>
      <span class="leaf-desc">${esc(headerText)}</span>
      ${node.value ? `<span class="leaf-value">${esc(node.value)}</span>` : ""}
      <span class="leaf-toggle" id="${id}-toggle">▾</span>
    </div>
    <div class="leaf-body collapsed" id="${id}-body" style="max-height:0">
      ${node.message ? `
        <span class="leaf-row-label">message</span>
        <span class="leaf-message">${esc(node.message)}</span>` : ""}
      ${node.repairHint ? `
        <span class="leaf-row-label">fix</span>
        <span class="leaf-hint">→ ${esc(node.repairHint)}</span>` : ""}
      <span class="leaf-row-label">focus</span>
      <span class="leaf-row-val">${esc(node.focusNode)}</span>
      <span class="leaf-row-label">component</span>
      <span class="leaf-row-val">${esc(node.component)}</span>
      ${depth > 0 ? `
        <span class="leaf-row-label">via</span>
        <span class="leaf-row-val leaf-chain">${chain.join(" → ")}</span>` : `
        <span class="leaf-row-label">kind</span>
        <span class="leaf-row-val" style="color:var(--text-dim)">direct violation</span>`}
      ${(node.altChains||[]).filter(c=>c.length).map(c => `
        <span class="leaf-row-label"><span class="alt-label">alt</span></span>
        <span class="leaf-row-val leaf-altchain">⎇ also via ${c.join(" → ")}</span>
      `).join("")}
    </div>`;
  return el;
}

// ── reference DOM ─────────────────────────────────────────────────────────
let refId = 0;
function mkRef(node, depth=0, ctx={ referencePaths: [], shapes: [] }) {
  const id = `ref-${refId++}`;
  const depthLabel = depth === 0 ? "root" : `depth ${depth}`;
  const leafCount = countLeaves(node.children || []);
  const leafLabel = `${leafCount} leaf failure${leafCount === 1 ? "" : "s"}`;
  const pathLabel = node.path || "sh:node";
  const nextCtx = {
    referencePaths: node.path
      ? [...(ctx.referencePaths || []), node.path]
      : [...(ctx.referencePaths || [])],
    shapes: (node.referencedShape || node.shape)
      ? [...(ctx.shapes || []), node.referencedShape || node.shape]
      : [...(ctx.shapes || [])],
  };

  const el = document.createElement("div");
  el.className = "ref-node";

  const childEls = (node.children || []).map(c =>
    c.type === "leaf" ? mkLeaf(c, nextCtx) : mkRef(c, depth+1, nextCtx)
  );

  const hdr = document.createElement("div");
  hdr.className = "ref-header";
  hdr.innerHTML = `
    <span class="ref-arrow" id="${id}-arrow">▶</span>
    <span class="ref-icon">↳</span>
    <span class="ref-path">${esc(pathLabel)}</span>
    ${node.referencedShape ? `
      <span class="ref-arrow-label">→</span>
      <span class="ref-target">${esc(node.referencedShape)}</span>` : ""}
    <span class="ref-arrow-label">via</span>
    <span class="ref-source">${esc(node.shape)}</span>
    <span class="ref-leaf-pill">${leafLabel}</span>
    <span class="ref-chain-pill">${depthLabel}</span>`;
  hdr.onclick = () => toggleRef(id);

  const kids = document.createElement("div");
  kids.className = "ref-children collapsed";
  kids.id = `${id}-children`;
  kids.style.maxHeight = "0px";
  childEls.forEach(c => kids.appendChild(c));

  el.appendChild(hdr);
  el.appendChild(kids);
  return el;
}

function toggleRef(id) {
  const kids  = document.getElementById(`${id}-children`);
  const arrow = document.getElementById(`${id}-arrow`);
  const open  = !kids.classList.contains("collapsed");
  if (open) {
    kids.style.maxHeight = kids.scrollHeight + "px";
    requestAnimationFrame(() => {
      kids.style.maxHeight = "0px";
      kids.classList.add("collapsed");
      arrow.classList.remove("open");
    });
  } else {
    kids.classList.remove("collapsed");
    kids.style.maxHeight = kids.scrollHeight + "px";
    arrow.classList.add("open");
    setTimeout(() => { kids.style.maxHeight = "9999px"; }, 250);
  }
}

function toggleLeaf(id) {
  const body   = document.getElementById(`${id}-body`);
  const toggle = document.getElementById(`${id}-toggle`);
  const open   = !body.classList.contains("collapsed");
  if (open) {
    body.style.maxHeight = body.scrollHeight + "px";
    requestAnimationFrame(() => {
      body.style.maxHeight = "0px";
      body.classList.add("collapsed");
      toggle.classList.remove("open");
    });
  } else {
    body.classList.remove("collapsed");
    body.style.maxHeight = body.scrollHeight + "px";
    toggle.classList.add("open");
    setTimeout(() => { body.style.maxHeight = "400px"; }, 220);
  }
}

function expandAll() {
  document.querySelectorAll(".ref-children.collapsed").forEach(el => {
    el.classList.remove("collapsed");
    el.style.maxHeight = "9999px";
  });
  document.querySelectorAll(".ref-arrow").forEach(el => el.classList.add("open"));
  document.querySelectorAll(".leaf-body.collapsed").forEach(el => {
    el.classList.remove("collapsed");
    el.style.maxHeight = "400px";
  });
  document.querySelectorAll(".leaf-toggle").forEach(el => el.classList.add("open"));
}

function expandVisible() {
  document.querySelectorAll(".ref-node").forEach(node => {
    if (node.style.display === "none") return;
    const kids = node.querySelector(":scope > .ref-children");
    const arrow = node.querySelector(":scope > .ref-header .ref-arrow");
    if (kids) {
      kids.classList.remove("collapsed");
      kids.style.maxHeight = "9999px";
    }
    if (arrow) arrow.classList.add("open");
  });
  document.querySelectorAll(".leaf-node").forEach(node => {
    if (node.style.display === "none") return;
    const body = node.querySelector(".leaf-body");
    const toggle = node.querySelector(".leaf-toggle");
    if (body) {
      body.classList.remove("collapsed");
      body.style.maxHeight = "400px";
    }
    if (toggle) toggle.classList.add("open");
  });
}

function collapseAll() {
  document.querySelectorAll(".ref-children").forEach(el => {
    el.style.maxHeight = "0px";
    el.classList.add("collapsed");
  });
  document.querySelectorAll(".ref-arrow").forEach(el => el.classList.remove("open"));
  document.querySelectorAll(".leaf-body").forEach(el => {
    el.style.maxHeight = "0px";
    el.classList.add("collapsed");
  });
  document.querySelectorAll(".leaf-toggle").forEach(el => el.classList.remove("open"));
}

// ── filter ────────────────────────────────────────────────────────────────
let activeFilters = {
  component: "all",
  path: "all",
  referencePath: "all",
  shape: "all",
  kind: "all",
};

function parseListDataset(value) {
  if (!value) return [];
  try { return JSON.parse(value); }
  catch (_) { return []; }
}

function filterMatches(el, type, value) {
  if (value === "all") return true;
  if (type === "referencePath")
    return parseListDataset(el.dataset.referencePaths).includes(value);
  if (type === "shape")
    return parseListDataset(el.dataset.shapes).includes(value);
  return el.dataset[type] === value;
}

function visibleLeafCount(root=document) {
  return Array.from(root.querySelectorAll(".leaf-node"))
    .filter(leaf => leaf.style.display !== "none").length;
}

function updateShowingCount() {
  const total = document.querySelectorAll(".leaf-node").length;
  const visible = visibleLeafCount();
  const el = document.getElementById("showing-count");
  if (el) el.textContent = `Showing ${visible} of ${total} failures`;
}

function updateSidebarVisibility() {
  const search = document.getElementById("focus-search");
  const empty = document.getElementById("focus-empty");
  const q = (search?.value || "").trim().toLowerCase();
  let visible = 0;

  document.querySelectorAll(".focus-item").forEach(item => {
    const block = document.getElementById(item.dataset.target);
    const hasVisibleLeaves = block && block.style.display !== "none";
    const searchMatch = !q || item.dataset.focus.includes(q);
    const show = hasVisibleLeaves && searchMatch;
    item.style.display = show ? "" : "none";
    if (show) visible += 1;
  });

  if (empty) empty.style.display = visible ? "none" : "block";
}

function applyFilter() {
  document.querySelectorAll(".leaf-node").forEach(el => {
    const visible = Object.entries(activeFilters).every(([type, value]) =>
      filterMatches(el, type, value)
    );
    el.style.display = visible ? "" : "none";
  });

  document.querySelectorAll(".ref-node").forEach(el => {
    const hasVisibleLeaf = Array.from(el.querySelectorAll(".leaf-node"))
      .some(leaf => leaf.style.display !== "none");
    el.style.display = hasVisibleLeaf ? "" : "none";
  });

  document.querySelectorAll(".ref-children").forEach(el => {
    const hasVisibleChild = Array.from(el.children)
      .some(child => child.style.display !== "none");
    el.style.display = hasVisibleChild ? "" : "none";
  });

  document.querySelectorAll(".focus-block").forEach(el => {
    const hasVisibleLeaf = Array.from(el.querySelectorAll(".leaf-node"))
      .some(leaf => leaf.style.display !== "none");
    el.style.display = hasVisibleLeaf ? "" : "none";
  });

  updateShowingCount();
  updateSidebarVisibility();
}

function setFilter(btn) {
  const type = btn.dataset.filterType;
  const value = btn.dataset.filterValue;
  document
    .querySelectorAll(`.filter-btn[data-filter-type="${type}"]`)
    .forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
  activeFilters[type] = value;
  applyFilter();
}

function makeFilterButton(type, value, label, count, active=false) {
  const btn = document.createElement("button");
  btn.className = "filter-btn" + (active ? " active" : "");
  btn.dataset.filterType = type;
  btn.dataset.filterValue = value;
  btn.onclick = () => setFilter(btn);
  btn.innerHTML = `${esc(label)}${count !== null ? `<span class="filter-count">${count}</span>` : ""}`;
  return btn;
}

function buildFilterGroup(id, type, label, rows, allLabel="all") {
  const container = document.getElementById(id);
  if (!container) return;
  container.innerHTML = "";
  const total = rows.reduce((sum, [, count]) => sum + count, 0);
  const labelEl = document.createElement("span");
  labelEl.className = "filter-label";
  labelEl.textContent = label;
  container.appendChild(labelEl);
  container.appendChild(makeFilterButton(type, "all", allLabel, total, true));
  rows.forEach(([value, count]) => {
    container.appendChild(makeFilterButton(type, value, value, count));
  });
}

function buildFilters(nodes) {
  const stats = collectFilterStats(nodes);
  buildFilterGroup(
    "component-filters",
    "component",
    "component",
    countMapEntries(stats.component),
  );
  buildFilterGroup(
    "path-filters",
    "path",
    "path",
    countMapEntries(stats.path),
  );
  buildFilterGroup(
    "reference-path-filters",
    "referencePath",
    "reference path",
    countMapEntries(stats.referencePath),
  );
  buildFilterGroup(
    "shape-filters",
    "shape",
    "shape",
    countMapEntries(stats.shape),
  );
  buildFilterGroup(
    "kind-filters",
    "kind",
    "kind",
    countMapEntries(stats.kind),
    "all kinds",
  );
}

// ── sidebar ───────────────────────────────────────────────────────────────
function buildSidebar(groups) {
  const container = document.getElementById("sidebar-items");
  const empty = document.getElementById("focus-empty");
  const search = document.getElementById("focus-search");
  container.innerHTML = "";

  Object.entries(groups).forEach(([fn, nodes], i) => {
    const lc = countLeaves(nodes);
    const targetId = `focus-${fn.replace(/[^a-z0-9]/gi,"_")}`;
    const item = document.createElement("div");
    item.className = "focus-item" + (i === 0 ? " active" : "");
    item.dataset.focus = fn.toLowerCase();
    item.dataset.target = targetId;
    item.innerHTML = `
      <span class="focus-dot"></span>
      <span class="focus-name" title="${esc(fn)}">${esc(fn.split(":").pop())}</span>
      <span class="focus-count">${lc}</span>`;
    item.onclick = () => {
      document.querySelectorAll(".focus-item").forEach(x => x.classList.remove("active"));
      item.classList.add("active");
      document.getElementById(targetId)?.scrollIntoView({ behavior:"smooth", block:"start" });
    };
    container.appendChild(item);
  });

  if (search) {
    search.oninput = updateSidebarVisibility;
  }
}

// ── stats ─────────────────────────────────────────────────────────────────
function updateStats(groups) {
  const allL = Object.values(groups).flatMap(ns => allLeaves(ns));
  document.getElementById("stat-focus").textContent  = Object.keys(groups).length;
  document.getElementById("stat-leaves").textContent = allL.length;
  document.getElementById("stat-depth").textContent  =
    maxDepth(Object.values(groups).flat());
  document.getElementById("stat-direct").textContent =
    allL.filter(l => l.refChain.length === 0).length;
}

// ── resizable sidebar ─────────────────────────────────────────────────────
function initSidebarResize() {
  const sidebar = document.querySelector(".sidebar");
  const resizer = document.getElementById("sidebar-resizer");
  if (!sidebar || !resizer) return;

  const savedWidth = localStorage.getItem("shacl-sidebar-width");
  if (savedWidth) {
    document.documentElement.style.setProperty("--sidebar-width", savedWidth);
  }

  resizer.addEventListener("pointerdown", event => {
    event.preventDefault();
    sidebar.classList.add("resizing");
    document.body.classList.add("resizing-sidebar");
    resizer.setPointerCapture(event.pointerId);
  });

  resizer.addEventListener("pointermove", event => {
    if (!sidebar.classList.contains("resizing")) return;
    const left = sidebar.getBoundingClientRect().left;
    const width = Math.min(520, Math.max(180, event.clientX - left));
    const value = `${Math.round(width)}px`;
    document.documentElement.style.setProperty("--sidebar-width", value);
    localStorage.setItem("shacl-sidebar-width", value);
  });

  function stopResize(event) {
    sidebar.classList.remove("resizing");
    document.body.classList.remove("resizing-sidebar");
    if (event?.pointerId !== undefined && resizer.hasPointerCapture(event.pointerId)) {
      resizer.releasePointerCapture(event.pointerId);
    }
  }

  resizer.addEventListener("pointerup", stopResize);
  resizer.addEventListener("pointercancel", stopResize);
}

// ── render ────────────────────────────────────────────────────────────────
function esc(s) {
  return String(s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;")
    .replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

function render() {
  // group by focus node
  const groups = {};
  for (const node of REPORT_DATA) {
    const fn = node.focusNode || node.focus_node || "unknown";
    (groups[fn] = groups[fn] || []).push(node);
  }

  buildSidebar(groups);
  buildFilters(REPORT_DATA);
  updateStats(groups);
  initSidebarResize();
  document.getElementById("gen-time").textContent = "2026-05-14 13:29:15";

  const report = document.getElementById("report");
  Object.entries(groups).forEach(([fn, nodes]) => {
    const lc = countLeaves(nodes);
    const block = document.createElement("div");
    block.className = "focus-block";
    block.id = `focus-${fn.replace(/[^a-z0-9]/gi,"_")}`;

    const hdr = document.createElement("div");
    hdr.className = "focus-header";
    hdr.innerHTML = `
      <span class="focus-node-label">${esc(fn)}</span>
      <span class="focus-badge">focus node</span>
      <span class="failure-count">${lc} failure${lc!==1?"s":""}</span>`;

    const tree = document.createElement("div");
    tree.className = "tree";
    nodes.forEach(n => tree.appendChild(n.type==="leaf" ? mkLeaf(n) : mkRef(n,0)));

    block.appendChild(hdr);
    block.appendChild(tree);
    report.appendChild(block);
  });

  applyFilter();
}

render();
